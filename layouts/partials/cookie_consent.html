<div id="cookie-banner"
     style="
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        background: #1a1a1a;
        color: #fff;
        padding: 1rem;
        display: none;
        z-index: 9999;
        text-align: center;
        font-size: 0.95rem;
     "
>
  <p style="margin-bottom: 0.75rem;">
    Diese Website verwendet Cookies für Google Analytics. Möchtest du zustimmen?
  </p>

  <button id="cookie-accept"
          style="
            padding: 0.5rem 1rem;
            margin-right: 1rem;
            background: #4caf50;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
          "
  >Ja</button>

  <button id="cookie-decline"
          style="
            padding: 0.5rem 1rem;
            background: #f44336;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
          "
  >Nein</button>
</div>
